name: CI

on:
  push:
    branches:
      - main
      - fase-2a-seguranca-critica
      - fase-2b-integridade-estoque
      - fase-2c-analytics-fiscal
      - fase-3-docker-staging
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install ruff==0.16.4
      - name: Ruff
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Teste determinístico dos gráficos
        run: node --test static/js/relatorios.test.mjs

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: reidofeno
          POSTGRES_USER: reidofeno
          POSTGRES_PASSWORD: reidofeno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reidofeno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reidofeno:reidofeno@localhost:5432/reidofeno
      REDIS_URL: redis://localhost:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-3f9c2d7a1b8e4f6c0a5d9e2b7c1f4a8d6e3b9c0f2a7d5e1b8c4f6a9d3e0b7c2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Testes com cobertura (PostgreSQL + Redis)
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov --cov-fail-under=80 --cov-report=xml:reports/coverage.xml --cov-report=term-missing
      - name: Migrações pendentes
        run: python manage.py makemigrations --check --dry-run
      - name: Upload de cobertura (Codecov)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./reports/coverage.xml
          flags: unittests
          fail_ci_if_error: false
      - name: Check de produção (PostgreSQL + Redis)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-3f9c2d7a1b8e4f6c0a5d9e2b7c1f4a8d6e3b9c0f2a7d5e1b8c4f6a9d3e0b7c2
          DJANGO_ALLOWED_HOSTS: example.com
          MERCADOPAGO_COLLECTOR_ID: collector-ci
          MERCADOPAGO_LIVE_MODE: "True"
          MERCADO_PAGO_FAKE: "False"
          BLING_FAKE: "False"
        run: python manage.py check --deploy
      - name: Migração histórica 0001 → HEAD (PostgreSQL)
        env:
          MIGRATION_DATABASE_URL: postgres://reidofeno:reidofeno@localhost:5432/reidofeno_migracao
        run: |
          python - <<'PY'
          import psycopg
          conn = psycopg.connect(
              "host=localhost user=reidofeno password=reidofeno dbname=postgres"
          )
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("DROP DATABASE IF EXISTS reidofeno_migracao")
              cur.execute("CREATE DATABASE reidofeno_migracao")
          conn.close()
          PY
          DATABASE_URL="$MIGRATION_DATABASE_URL" python manage.py migrate sales 0001 --noinput
          DATABASE_URL="$MIGRATION_DATABASE_URL" python manage.py migrate stock 0001 --noinput
          DATABASE_URL="$MIGRATION_DATABASE_URL" python manage.py validar_migracao_legado --criar
          DATABASE_URL="$MIGRATION_DATABASE_URL" python manage.py migrate --noinput
          DATABASE_URL="$MIGRATION_DATABASE_URL" python manage.py validar_migracao_legado --verificar
      - name: Publicar relatórios de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-testes
          path: reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar env descartável
        run: |
          cp .env.docker.example .env.docker
          cp infra/.env.example infra/.env
          cp .env.docker.smoke.example .env.docker.smoke
          cp infra/.env.smoke.example infra/.env.smoke
      - name: Validar sintaxe dos scripts de smoke
        run: |
          bash -n infra/scripts/smoke-stack.sh
          bash -n infra/scripts/test-smoke-isolation.sh
      - name: Build da imagem runtime
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --target runtime -t reidofeno:ci -f infra/Dockerfile .
      - name: Build da imagem dev (pytest/runserver)
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --target dev -t reidofeno:dev-ci -f infra/Dockerfile .
      - name: Dependências do stage dev
        run: |
          docker run --rm reidofeno:dev-ci python -c \
            "import django, pytest, factory, coverage; print('DEV_DEPS_OK')"
      - name: Container roda como non-root
        run: |
          uid=$(docker run --rm -e RUN_MIGRATIONS=false reidofeno:ci id -u)
          echo "uid=$uid"
          test "$uid" = "1000"
      - name: Django check dentro da imagem
        run: |
          docker run --rm \
            -e RUN_MIGRATIONS=false \
            -e DJANGO_SETTINGS_MODULE=config.settings.build \
            reidofeno:ci python manage.py check
      - name: Tamanho da imagem (< 500 MB)
        run: |
          bytes=$(docker image inspect reidofeno:ci --format '{{.Size}}')
          echo "Imagem final: $((bytes / 1024 / 1024)) MB"
          test "$bytes" -lt 500000000
      - name: Validar Caddyfile (runtime e dev)
        run: |
          test -f infra/Caddyfile
          test -f infra/transport.caddy
          test -f infra/transport-dev.caddy
          docker run --rm \
            --mount "type=bind,source=$PWD/infra/Caddyfile,target=/etc/caddy/Caddyfile,readonly" \
            --mount "type=bind,source=$PWD/infra/transport.caddy,target=/etc/caddy/transport.caddy,readonly" \
            caddy:2-alpine caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            --mount "type=bind,source=$PWD/infra/Caddyfile,target=/etc/caddy/Caddyfile,readonly" \
            --mount "type=bind,source=$PWD/infra/transport-dev.caddy,target=/etc/caddy/transport.caddy,readonly" \
            caddy:2-alpine caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validar modelos Compose
        run: |
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml config --quiet
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml config --quiet
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml --profile cron config --quiet
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml \
            --profile cron config --quiet
          docker compose --project-name reidofeno_smoke \
            --env-file infra/.env.smoke \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.smoke.yml \
            --profile cron config --quiet
      - name: Settings no container dev (ambiente staging)
        env:
          IMAGE_TAG: dev-ci
        run: |
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml up -d db redis
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml \
            run --rm web pytest -p no:cacheprovider \
            core/tests/test_settings_production.py -q
      - name: Suíte completa no container dev (PostgreSQL/Redis)
        env:
          IMAGE_TAG: dev-ci
        run: |
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml \
            run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            -e REDIS_URL=redis://redis:6379/0 \
            web pytest -p no:cacheprovider
      - name: Derrubar stack dev
        run: |
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml \
            down -v --remove-orphans
      - name: Smoke runtime + isolamento (HTTPS, SEC-03, cron, persistência)
        env:
          IMAGE_TAG: ci
        run: bash infra/scripts/test-smoke-isolation.sh
      - name: Diagnóstico dos smokes
        if: failure()
        run: |
          docker compose --project-name reidofeno_smoke \
            --env-file infra/.env.smoke \
            -f infra/docker-compose.yml -f infra/docker-compose.smoke.yml \
            --profile cron ps || true
          docker compose --project-name reidofeno_smoke \
            --env-file infra/.env.smoke \
            -f infra/docker-compose.yml -f infra/docker-compose.smoke.yml \
            --profile cron logs --no-color --tail=200 || true
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml ps || true
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml \
            logs --no-color --tail=200 || true
      - name: Cleanup descartável
        if: always()
        run: |
          docker compose --project-name reidofeno_smoke \
            --env-file infra/.env.smoke \
            -f infra/docker-compose.yml -f infra/docker-compose.smoke.yml \
            --profile cron down -v --remove-orphans || true
          docker compose --project-name reidofeno \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.override.yml --profile cron \
            down -v --remove-orphans || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: |
          pip install --upgrade pip
          pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit (análise estática)
        run: |
          mkdir -p reports
          bandit -c pyproject.toml -r . -ll -f txt -o reports/bandit.txt && cat reports/bandit.txt
      - name: pip-audit (dependências)
        run: pip-audit -r requirements.txt --desc off

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (regras da comunidade)
        run: semgrep scan --config auto --error || true
        continue-on-error: true
      - name: Semgrep (segurança estrita)
        run: semgrep scan --config p/default --severity ERROR
