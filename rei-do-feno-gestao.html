<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rei do Feno — Gestão</title>
<style>
  :root{
    --paper:#f4f6f3; --surface:#ffffff; --surface-2:#fbfcfa;
    --ink:#16211c; --muted:#5d6b62; --faint:#8a978d;
    --line:#e4e8e2; --line-2:#eef1ec;
    --brand:#0e7a5f; --brand-deep:#0a5745; --brand-soft:#e4f1eb;
    --gold:#a9701a; --gold-soft:#f7ecd6;
    --rose:#ac4137; --rose-soft:#f6e2df;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --r:10px; --r-sm:7px;
    --shadow:0 1px 2px rgba(22,33,28,.04),0 4px 16px rgba(22,33,28,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans); background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  button{font-family:inherit; cursor:pointer}
  input,select{font-family:inherit; font-size:14px}
  ::selection{background:var(--brand-soft)}

  .app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
  .sidebar{background:var(--ink); color:#cdd7d0; padding:22px 16px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh}
  .brand{display:flex; align-items:center; gap:11px; padding:4px 8px 20px}
  .brand .mark{width:34px; height:34px; border-radius:9px; flex:0 0 auto; background:linear-gradient(135deg,var(--brand),var(--brand-deep)); display:grid; place-items:center; color:#fff; font-weight:700; font-size:17px}
  .brand b{color:#fff; font-size:15px; font-weight:650; display:block; line-height:1.15}
  .brand span{font-size:11.5px; color:#8ba095}
  .nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:#6f857a; padding:14px 10px 6px}
  .nav-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; border:0; color:#cdd7d0; padding:9px 10px; border-radius:8px; font-size:13.5px; transition:background .14s,color .14s}
  .nav-btn svg{width:17px; height:17px; flex:0 0 auto; opacity:.85}
  .nav-btn:hover{background:rgba(255,255,255,.06); color:#fff}
  .nav-btn.active{background:var(--brand); color:#fff}
  .nav-btn.active svg{opacity:1}
  .nav-btn .pip{margin-left:auto; background:var(--gold); color:#fff; font-size:11px; font-weight:600; min-width:19px; height:19px; padding:0 5px; border-radius:20px; display:grid; place-items:center}
  .sidebar-foot{margin-top:auto; font-size:11px; color:#6f857a; padding:10px}

  .main{min-width:0; display:flex; flex-direction:column}
  .topbar{display:flex; align-items:center; gap:16px; padding:18px 30px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:20}
  .topbar h1{font-size:19px; font-weight:640; margin:0; letter-spacing:-.01em}
  .topbar .sub{color:var(--muted); font-size:12.5px; margin-top:2px}
  #topActions{display:flex; gap:9px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
  .content{padding:26px 30px 60px; max-width:1180px; width:100%}

  .btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:var(--r-sm); font-size:13.5px; font-weight:550; display:inline-flex; align-items:center; gap:7px; transition:.14s}
  .btn:hover{border-color:#cfd6cd; background:var(--surface-2)}
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn-primary:hover{background:var(--brand-deep); border-color:var(--brand-deep)}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed}
  .btn-ghost{border-color:transparent; background:transparent; padding:7px 9px}
  .btn-ghost:hover{background:var(--line-2)}
  .btn-sm{padding:6px 11px; font-size:12.5px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
  .pad{padding:20px}

  .filters{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:22px}
  .field{display:flex; flex-direction:column; gap:5px}
  .field label{font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
  .field select,.field input{border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 11px; background:var(--surface); color:var(--ink); min-width:150px; transition:border .14s,box-shadow .14s}
  .field select:focus,.field input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
  .spacer{flex:1}

  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 17px; box-shadow:var(--shadow)}
  .kpi .k-lbl{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px}
  .kpi .k-val{font-size:25px; font-weight:640; margin-top:9px}
  .kpi .k-sub{font-size:12px; color:var(--faint); margin-top:3px}
  .kpi.accent{background:linear-gradient(160deg,#0f7a5f,#0a5947); border-color:transparent; color:#fff}
  .kpi.accent .k-lbl,.kpi.accent .k-sub{color:#bfe3d6}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .banner{display:flex; align-items:center; gap:11px; padding:12px 16px; border-radius:var(--r); margin-bottom:20px; font-size:13.5px}
  .banner.warn{background:var(--gold-soft); color:#7a5313; border:1px solid #eddcb8}
  .banner.block{background:var(--rose-soft); color:#7d2a22; border:1px solid #eecac5}
  .banner svg{width:18px;height:18px;flex:0 0 auto}

  .chart-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:8px}
  .chart-head h3{margin:0; font-size:15px; font-weight:620}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--muted)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .chart-wrap{width:100%; overflow:hidden}
  svg .bar-c{fill:var(--line)}
  svg .bar-p{fill:var(--brand)}
  svg text{font-family:var(--sans)}

  .table-scroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:520px}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
  td{padding:12px 14px; border-bottom:1px solid var(--line-2); font-size:13.5px}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  .num{text-align:right}
  th.num{text-align:right}

  .tag{display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:20px; background:var(--line-2); color:var(--muted); font-weight:550; white-space:nowrap}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:2px 9px; border-radius:20px; font-weight:600; white-space:nowrap}
  .badge.low{background:var(--gold-soft); color:var(--gold)}
  .badge.ok{background:var(--brand-soft); color:var(--brand-deep)}
  .badge.out,.badge.blocked{background:var(--rose-soft); color:var(--rose)}
  .section-title{display:flex; align-items:center; justify-content:space-between; margin:0 0 16px; gap:12px; flex-wrap:wrap}
  .section-title h2{font-size:16px; font-weight:620; margin:0}
  .hint{color:var(--faint); font-size:12.5px}

  .seg{display:inline-flex; background:var(--line-2); border-radius:8px; padding:3px}
  .seg button{border:0; background:transparent; padding:7px 15px; border-radius:6px; font-size:13px; font-weight:550; color:var(--muted)}
  .seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06)}

  .overlay{position:fixed; inset:0; background:rgba(18,26,22,.42); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:6vh 20px; z-index:100; overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:440px; box-shadow:0 24px 60px rgba(0,0,0,.24); animation:pop .18s ease}
  .modal.wide{max-width:520px}
  @keyframes pop{from{opacity:0; transform:translateY(8px) scale(.99)}to{opacity:1}}
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between}
  .modal-head h3{margin:0; font-size:16px; font-weight:640}
  .modal-body{padding:20px 22px; display:flex; flex-direction:column; gap:15px}
  .modal-foot{padding:15px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end}
  .form-row{display:flex; flex-direction:column; gap:6px}
  .form-row label{font-size:12.5px; font-weight:600; color:var(--muted)}
  .form-row input,.form-row select{border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; width:100%}
  .form-row input:focus,.form-row select:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:13px}
  .form-grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:13px}
  .err{color:var(--rose); font-size:12.5px; min-height:16px}
  .demo-note{background:var(--gold-soft); color:#7a5313; font-size:12px; padding:9px 12px; border-radius:8px; line-height:1.45}
  .co-steps{display:flex; gap:8px; font-size:12px; color:var(--faint); margin-bottom:2px; flex-wrap:wrap}
  .summary-line{display:flex; justify-content:space-between; align-items:center; font-size:13px; gap:10px}
  .nota-block{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:13px 14px; font-size:12.5px; line-height:1.6}
  .nota-block h5{margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  .pos{color:var(--brand-deep); font-weight:600}
  .neg{color:var(--rose); font-weight:600}
  .badge.okc{background:var(--brand-soft); color:var(--brand-deep)}
  .badge.overdue{background:var(--rose-soft); color:var(--rose)}
  .textarea{border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; width:100%; min-height:120px; font-family:inherit; font-size:14px; resize:vertical; line-height:1.5}
  .textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
  .recipient{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-2)}
  .recipient:last-child{border-bottom:0}
  input[type=checkbox]{accent-color:var(--brand)}
  @media (max-width:860px){ .content > div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important} }

  .vitrine-top{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap}
  .grid-prod{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:15px}
  .pcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:9px; box-shadow:var(--shadow)}
  .pcard .thumb{height:78px; border-radius:8px; background:linear-gradient(135deg,var(--brand-soft),#f0f5f1); display:grid; place-items:center; font-size:26px; color:var(--brand-deep); font-weight:700; margin-bottom:3px}
  .pcard h4{margin:0; font-size:14.5px; font-weight:600; line-height:1.3}
  .pcard .price{font-size:19px; font-weight:660}
  .pcard .avail{font-size:12px; color:var(--muted)}
  .pcard .avail.last{color:var(--gold); font-weight:600}
  .pcard .avail.no{color:var(--rose); font-weight:600}
  .stepper{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; width:fit-content}
  .stepper button{width:32px; height:32px; border:0; background:var(--surface-2); font-size:16px; color:var(--ink)}
  .stepper button:hover{background:var(--line-2)}
  .stepper button:disabled{opacity:.4}
  .stepper span{width:38px; text-align:center; font-size:14px}
  .pcard .row{display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:10px}

  .cart{position:fixed; top:0; right:0; height:100vh; width:380px; max-width:92vw; background:var(--surface); box-shadow:-8px 0 40px rgba(0,0,0,.16); transform:translateX(100%); transition:transform .24s ease; z-index:110; display:flex; flex-direction:column}
  .cart.open{transform:translateX(0)}
  .cart-head{padding:18px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between}
  .cart-head h3{margin:0; font-size:16px}
  .cart-items{flex:1; overflow:auto; padding:8px 20px}
  .citem{display:flex; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line-2)}
  .citem .ci-name{flex:1; font-size:13.5px}
  .citem .ci-name small{display:block; color:var(--faint); font-size:11.5px}
  .cart-foot{padding:18px 20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
  .cart-empty{padding:50px 20px; text-align:center; color:var(--faint); font-size:13.5px}
  .cart-total{display:flex; justify-content:space-between; align-items:baseline; font-size:15px}
  .cart-total b{font-size:21px; font-weight:660}

  .empty{padding:44px; text-align:center; color:var(--faint)}
  .empty svg{width:34px;height:34px;opacity:.4;margin-bottom:8px}

  .pay-methods{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .pay-opt{border:1.5px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--muted); background:var(--surface)}
  .pay-opt.on{border-color:var(--brand); background:var(--brand-soft); color:var(--brand-deep)}
  .pay-opt .ic{font-size:22px}
  .pix-box{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
  .pix-code{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:var(--mono); font-size:11px; word-break:break-all; color:var(--muted)}
  .success{text-align:center; padding:14px 0}
  .success .ok-ic{width:56px; height:56px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; margin:0 auto 14px; font-size:28px}

  .toast-wrap{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center}
  .toast{color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 8px 30px rgba(0,0,0,.25); display:flex; align-items:center; gap:9px; animation:up .22s ease; background:var(--ink)}
  .toast.warn{background:#8a5a12}
  .toast.block{background:#8f342b}
  .toast .dot{background:var(--brand)}
  @keyframes up{from{opacity:0; transform:translateY(10px)}to{opacity:1}}
  .cart-count{background:var(--gold); color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px; border-radius:20px; display:inline-grid; place-items:center; padding:0 5px}

  /* Kiosk / modo loja */
  body.kiosk .sidebar{display:none}
  body.kiosk .app{grid-template-columns:1fr}
  body.kiosk .menu-btn{display:none!important}
  body.kiosk .topbar{background:linear-gradient(120deg,var(--brand-deep),var(--brand)); border-color:transparent}
  body.kiosk .topbar h1{color:#fff}
  body.kiosk .topbar .sub{color:#bfe3d6}
  body.kiosk .content{max-width:1280px}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed; z-index:80; transform:translateX(-100%); transition:transform .2s; width:232px}
    .sidebar.open{transform:translateX(0)}
    .kpis{grid-template-columns:1fr 1fr}
    .content{padding:20px 16px 60px}
    .topbar{padding:14px 16px}
    .menu-btn{display:inline-flex!important}
    .form-grid,.form-grid-3{grid-template-columns:1fr}
  }
  .menu-btn{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:70;display:none}
  .scrim.show{display:block}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark" id="storeMark">L</div>
      <div><b id="storeNameSide">Rei do Feno</b><span>Gestão &amp; Vitrine</span></div>
    </div>
    <div class="nav-label">Gestão</div>
    <button class="nav-btn active" data-view="painel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Painel</button>
    <button class="nav-btn" data-view="produtos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9 4-9-4 9-4 9 4z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/></svg>Produtos</button>
    <button class="nav-btn" data-view="movimentacoes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17l-4-4 4-4"/><path d="M3 13h13"/><path d="M17 7l4 4-4 4"/><path d="M21 11H8"/></svg>Movimentações
      <span class="pip" id="lowPip" style="display:none">0</span></button>
    <button class="nav-btn" data-view="custos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18v12H3z"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>Custos</button>
    <button class="nav-btn" data-view="clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0111 0"/><path d="M16 6.5a3 3 0 010 6"/><path d="M18 20a5.5 5.5 0 00-3-4.9"/></svg>Clientes</button>
    <div class="nav-label">Loja</div>
    <button class="nav-btn" data-view="vitrine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9h16v11H4z"/><path d="M9 9v0a3 3 0 006 0"/></svg>Vitrine</button>
    <button class="nav-btn" data-view="avisos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>Avisos</button>
    <div class="sidebar-foot">Dados salvos automaticamente neste dispositivo.</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="btn btn-ghost menu-btn" id="menuBtn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div style="flex:1"><h1 id="pageTitle">Painel</h1><div class="sub" id="pageSub">Visão geral de vendas, estoque e lucro</div></div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="cart" id="cart">
  <div class="cart-head"><h3>Seu pedido</h3><button class="btn btn-ghost" id="closeCart" aria-label="Fechar">✕</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot" id="cartFoot"></div>
</div>

<div class="overlay" id="overlay"><div id="modalHost"></div></div>
<div class="toast-wrap" id="toasts"></div>

<script>
const STORAGE_KEY='reidofeno:data:v1';
const hasStore = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
let mem=null;
let state={ settings:{storeName:'Rei do Feno'}, products:[], movements:[], customers:[], orders:[], expenses:[] };
let cart={}; let view='painel'; let kiosk=false; let pendingName=''; let payMethod='pix';
let checkoutStep='identify', coDelivery='retirar', coCustomer={}, lastOrderId=null;
let aviso={msg:'',audience:'todos',cat:''};
let uidCounter=Date.now();
const uid=()=>'id'+(uidCounter++).toString(36);

const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>BRL.format(v||0);
const pct=v=>(v*100).toFixed(1).replace('.',',')+'%';
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtDate=iso=>{const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+' '+MES[d.getMonth()]+' '+d.getFullYear();};

/* ---------- Cálculos ---------- */
const prodById=id=>state.products.find(p=>p.id===id);
function stockStatus(p){ if(p.stock<=0)return'out'; if(p.stock<=(p.blockStock||0))return'blocked'; if(p.stock<=p.minStock)return'low'; return'ok'; }
const statusRank=s=>({ok:0,low:1,blocked:2,out:3})[s];
const canSellOnline=p=>p.stock>0 && p.stock>(p.blockStock||0);

function periodRange(kind){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),iso=d=>d.toISOString().slice(0,10);
  switch(kind){
    case'mes':return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];
    case'3m':return[iso(new Date(y,m-2,1)),iso(new Date(y,m+1,0))];
    case'6m':return[iso(new Date(y,m-5,1)),iso(new Date(y,m+1,0))];
    case'ano':return[iso(new Date(y,0,1)),iso(new Date(y,11,31))];
    case'12m':return[iso(new Date(y,m-11,1)),iso(new Date(y,m+1,0))];
    default:return[null,null];
  }
}
let filter={period:'12m',from:null,to:null,category:'all'};
function filteredSales(){
  let[from,to]=filter.period==='custom'?[filter.from,filter.to]:periodRange(filter.period);
  return state.movements.filter(mv=>{
    if(mv.type!=='out')return false;
    if(from&&mv.date<from)return false; if(to&&mv.date>to)return false;
    if(filter.category!=='all'){const p=prodById(mv.productId); if(!p||p.category!==filter.category)return false;}
    return true;
  });
}
function totals(s){let rev=0,cost=0,units=0;s.forEach(x=>{rev+=x.qty*x.unit;cost+=x.qty*(x.cost||0);units+=x.qty;});return{rev,cost,profit:rev-cost,units,margin:rev?(rev-cost)/rev:0,orders:s.length};}
const categories=()=>[...new Set(state.products.map(p=>p.category))].sort();

function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const CUST_CATS=['Haras','Fazenda/Sítio','Criador','Revenda/Agro','Pet shop','Consumidor final'];
function cleanCPF(v){return(v||'').replace(/\D/g,'');}
function validCPF(v){const c=cleanCPF(v);if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let d=(s*10)%11;if(d===10)d=0;if(d!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);let d2=(s*10)%11;if(d2===10)d2=0;return d2===+c[10];}
function maskCPF(v){const c=cleanCPF(v);return c.length===11?c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):v||'';}

function monthlyChart(){

  for(let b=11;b>=0;b--){const d=new Date(now.getFullYear(),now.getMonth()-b,1);buckets.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:MES[d.getMonth()],rev:0,cost:0});}
  const map={};buckets.forEach(x=>map[x.key]=x);
  state.movements.forEach(mv=>{if(mv.type!=='out')return;if(filter.category!=='all'){const p=prodById(mv.productId);if(!p||p.category!==filter.category)return;}const k=monthKey(mv.date);if(map[k]){map[k].rev+=mv.qty*mv.unit;map[k].cost+=mv.qty*(mv.cost||0);}});
  const maxRev=Math.max(1,...buckets.map(b=>b.rev));
  const W=760,H=240,padL=46,padB=34,padT=10,padR=8,cw=W-padL-padR,ch=H-padB-padT,bw=cw/buckets.length,barW=Math.min(34,bw*0.6);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Vendas por mês">';
  for(let g=0;g<=4;g++){const y=padT+ch*(g/4),val=maxRev*(1-g/4);svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef1ec"/><text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#8a978d">'+(val>=1000?(val/1000).toFixed(0)+'k':val.toFixed(0))+'</text>';}
  buckets.forEach((b,i)=>{const x=padL+i*bw+(bw-barW)/2,hRev=ch*(b.rev/maxRev),hCost=ch*(b.cost/maxRev),hProf=hRev-hCost,yTop=padT+ch-hRev;
    svg+='<rect class="bar-c" x="'+x+'" y="'+(padT+ch-hCost)+'" width="'+barW+'" height="'+hCost+'" rx="2"/>';
    svg+='<rect class="bar-p" x="'+x+'" y="'+yTop+'" width="'+barW+'" height="'+Math.max(0,hProf)+'" rx="2"><title>'+b.label+' — receita '+money(b.rev)+'</title></rect>';
    svg+='<text x="'+(x+barW/2)+'" y="'+(H-padB+16)+'" text-anchor="middle" font-size="10.5" fill="#5d6b62">'+b.label+'</text>';});
  svg+='</svg>'; const w=el('div','chart-wrap'); w.innerHTML=svg; return w;
}

      '<div class="pay-methods">'+
        '<button class="pay-opt '+(payMethod==='pix'?'on':'')+'" onclick="setPay(\'pix\','+total+')"><span class="ic">⚡</span>Pix</button>'+

function pixCode(total){const v=total.toFixed(2);let base='00020126BR.GOV.BCB.PIX'+Math.random().toString(36).slice(2,10).toUpperCase();return (base+'5204000053039865406'+v+'5802BR5913MINHA LOJA6009SAO PAULO62070503***6304DEMO').replace(/\s/g,'');}
function fakeQR(seed){
  const N=25,cell=6,size=N*cell; let h=0; for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  const rnd=()=>{h=(h*1103515245+12345)>>>0;return(h>>>16)/65536;};
  let r='<svg viewBox="0 0 '+size+' '+size+'" width="150" height="150" style="border-radius:8px;background:#fff"><rect width="'+size+'" height="'+size+'" fill="#fff"/>';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);if(inF)continue;if(rnd()>0.52)r+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" fill="#16211c"/>';}
  const f=(x,y)=>{r+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+(7*cell)+'" height="'+(7*cell)+'" fill="#16211c"/><rect x="'+((x+1)*cell)+'" y="'+((y+1)*cell)+'" width="'+(5*cell)+'" height="'+(5*cell)+'" fill="#fff"/><rect x="'+((x+2)*cell)+'" y="'+((y+2)*cell)+'" width="'+(3*cell)+'" height="'+(3*cell)+'" fill="#16211c"/>';};
  f(0,0);f(N-7,0);f(0,N-7); return r+'</svg>';
}
function copyPix(){const t=$('#pixCode');if(!t)return;navigator.clipboard&&navigator.clipboard.writeText(t.textContent).then(()=>toast('Código Pix copiado')).catch(()=>toast('Selecione e copie o código'));}
function confirmPayment(total){
  if(payMethod==='cartao'){
    const num=($('#cc_num')||{}).value||'',cvv=($('#cc_cvv')||{}).value||'',nm=($('#cc_name')||{}).value||'';
    if(num.replace(/\s/g,'').length<12||cvv.length<3||!nm.trim()){$('#pay_err').textContent='Preencha os dados do cartão (demonstração).';return;}
  }
  finalizeOrder(total);
  checkoutStep='done';
  showModal('<div class="modal"><div class="modal-body"><div class="success"><div class="ok-ic">✓</div>'+
    '<h3 style="margin:0 0 6px">Pedido confirmado!</h3>'+
    '<p style="color:var(--muted);margin:0">Pagamento via '+(payMethod==='pix'?'Pix':'cartão')+' registrado para <b>'+escapeHtml(coCustomer.name)+'</b>. '+(coDelivery==='entrega'?'Sairá para entrega.':'Disponível para retirada.')+'</p></div></div>'+
    '<div class="modal-foot"><button class="btn" onclick="showNota(lastOrderId)">Ver dados p/ nota</button><button class="btn btn-primary" onclick="closeModal()">Concluir</button></div></div>');
}
async function finalizeOrder(total){
  const ids=Object.keys(cart); if(!ids.length)return; const date=todayISO();
  // cadastro / atualização do cliente
  let cust;
  if(coCustomer.id){ cust=custById(coCustomer.id); if(cust)Object.assign(cust,coCustomer,{delivery:coDelivery}); }
  if(!cust){ const existing=custByCPF(coCustomer.cpf);
    if(existing){cust=existing;Object.assign(cust,coCustomer,{id:existing.id,delivery:coDelivery});}
    else{cust=Object.assign({},coCustomer,{id:uid(),cpf:cleanCPF(coCustomer.cpf),delivery:coDelivery,createdAt:date});state.customers.push(cust);} }
  cust.cpf=cleanCPF(cust.cpf);
  // pedido + baixa de estoque
  const items=[], before={}, affected=[];
  ids.forEach(id=>{before[id]=stockStatus(prodById(id));});
  ids.forEach(id=>{const p=prodById(id),q=cart[id];
    items.push({productId:id,name:p.name,qty:q,unit:p.onlinePrice});
    state.movements.push({id:uid(),type:'out',productId:id,qty:q,unit:p.onlinePrice,cost:p.buyCost,date,note:'Pedido online — '+cust.name,channel:'online',payment:payMethod,customerId:cust.id});
    p.stock=Math.max(0,p.stock-q); affected.push(id);});
  const order={id:uid(),customerId:cust.id,date,items,total,payment:payMethod,delivery:coDelivery,channel:'online'};
  state.orders.push(order); lastOrderId=order.id;
  cart={}; pendingName=''; await saveData(); notifyCrossings(affected,before); render();
}
function notifyCrossings(ids,before){
  ids.forEach(id=>{const p=prodById(id);if(!p)return;const now=stockStatus(p);if(statusRank(now)>statusRank(before[id]||'ok')){
    if(now==='out')toast('“'+p.name+'” esgotou',' block');
    else if(now==='blocked')toast('Vendas online bloqueadas: “'+p.name+'”','block');
    else if(now==='low')toast('Estoque baixo: “'+p.name+'” ('+p.stock+')','warn');
  }});
}

/* ---------- Cadência / periodicidade de compra ---------- */
function customerCadence(id){
  const os=custOrders(id).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(os.length<2)return null;
  let sum=0,cnt=0;
  for(let i=1;i<os.length;i++){const d=(new Date(os[i].date)-new Date(os[i-1].date))/86400000;if(d>0){sum+=d;cnt++;}}
  if(!cnt)return null;
  const avg=sum/cnt, last=new Date(os[os.length-1].date), daysSince=Math.floor((Date.now()-last)/86400000);
  let status='em dia'; if(daysSince>avg*1.3)status='atrasado'; else if(daysSince>avg*0.8)status='em breve';
  return {avg:Math.round(avg),daysSince,status,orders:os.length};
}
function overdueCustomers(){return state.customers.map(c=>({c,cad:customerCadence(c.id)})).filter(x=>x.cad&&x.cad.status==='atrasado').sort((a,b)=>b.cad.daysSince-a.cad.daysSince);}

function audienceList(){
  let list=state.customers.slice();
  if(aviso.audience==='cat')list=list.filter(c=>(c.category||'')===aviso.cat);
  else if(aviso.audience==='overdue'){const ids=overdueCustomers().map(x=>x.c.id);list=list.filter(c=>ids.includes(c.id));}
  else if(aviso.audience==='entrega')list=list.filter(c=>c.delivery==='entrega');
  else if(aviso.audience==='retirar')list=list.filter(c=>c.delivery!=='entrega');
  return list;
}

function cleanCNPJ(v){return(v||'').replace(/\D/g,'');}
function validCNPJ(v){const c=cleanCNPJ(v);if(c.length!==14||/^(\d)\1{13}$/.test(c))return false;const b=c.split('').map(Number);const w1=[5,4,3,2,9,8,7,6,5,4,3,2],w2=[6,5,4,3,2,9,8,7,6,5,4,3,2];let s=0;for(let i=0;i<12;i++)s+=b[i]*w1[i];let d1=s%11;d1=d1<2?0:11-d1;if(d1!==b[12])return false;s=0;for(let i=0;i<13;i++)s+=b[i]*w2[i];let d2=s%11;d2=d2<2?0:11-d2;return d2===b[13];}
function maskCNPJ(v){const c=cleanCNPJ(v);return c.length===14?c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):v||'';}
const KIND_LBL={mercadoria:'Mercadoria',insumo:'Insumo',operacional:'Operacional'};

function expensesFiltered(){

  return state.expenses.filter(e=>{if(from&&e.date<from)return false;if(to&&e.date>to)return false;if(costFilter.kind!=='all'&&e.kind!==costFilter.kind)return false;if(costFilter.category!=='all'&&e.category!==costFilter.category)return false;return true;});
}
function opExpensesInPeriod(){let[from,to]=filter.period==='custom'?[filter.from,filter.to]:periodRange(filter.period);return state.expenses.filter(e=>e.kind==='operacional'&&(!from||e.date>=from)&&(!to||e.date<=to)).reduce((s,e)=>s+e.amount,0);}

async function saveExpense(id){
  const g=k=>($('#e_'+k)||{}).value||'';
  const amount=parseFloat(g('amount'))||0, category=g('cat').trim()||'Outros', cnpj=cleanCNPJ(g('cnpj'));
  if(amount<=0){$('#e_err').textContent='Informe um valor maior que zero.';return;}
  if(cnpj&&!validCNPJ(cnpj)){$('#e_err').textContent='CNPJ inválido. Deixe em branco se não tiver.';return;}
  const data={date:g('date')||todayISO(),category,kind:g('kind'),supplier:g('supplier').trim(),cnpj,amount,note:g('note').trim(),recurring:($('#e_rec')||{}).checked||false};
  if(id)Object.assign(state.expenses.find(x=>x.id===id),data); else state.expenses.push(Object.assign({id:uid()},data));
  await saveData();closeModal();toast(id?'Custo atualizado':'Custo lançado');render();
}
function deleteExpense(id){showConfirm('Excluir custo?','Este lançamento será removido.',async()=>{state.expenses=state.expenses.filter(x=>x.id!==id);await saveData();closeModal();toast('Custo excluído');render();});}
function exportExpenses(){
  let csv='Data;Categoria;Tipo;Fornecedor;CNPJ;Valor;Recorrente;Observacao\n';
  state.expenses.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(e=>{csv+=[e.date,e.category,KIND_LBL[e.kind]||e.kind,e.supplier||'',e.cnpj?maskCNPJ(e.cnpj):'',String(e.amount.toFixed(2)).replace('.',','),e.recurring?'Sim':'Nao',(e.note||'').replace(/;/g,',')].join(';')+'\n';});
  const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'});const a=el('a');a.href=URL.createObjectURL(blob);a.download='custos.csv';a.click();toast('Custos exportados');
}

async function saveProd(id){
  const name=$('#f_name').value.trim(),cat=$('#f_cat').value.trim()||'Geral';
  const buy=parseFloat($('#f_buy').value)||0,sell=parseFloat($('#f_sell').value)||0,online=parseFloat($('#f_online').value)||0;
  const stock=parseInt($('#f_stock').value)||0,min=parseInt($('#f_min').value)||0,block=parseInt($('#f_block').value)||0;
  const icon=$('#f_icon').value.trim();
  if(!name){$('#f_err').textContent='Informe o nome do produto.';return;}
  if(block>min){$('#f_err').textContent='O bloqueio (Y) deve ser menor ou igual ao aviso (X).';return;}
  const data={name,category:cat,buyCost:buy,salePrice:sell,onlinePrice:online||sell,stock,minStock:min,blockStock:block,icon};
  if(id)Object.assign(prodById(id),data); else state.products.push({id:uid(),...data});
  await saveData(); closeModal(); toast(id?'Produto atualizado':'Produto adicionado'); render();
}

  const isIn=type==='in';
  showModal('<div class="modal"><div class="modal-head"><h3>Registrar movimentação</h3><button class="btn btn-ghost" onclick="closeModal()">✕</button></div>'+
    '<div class="modal-body"><div class="seg" style="align-self:flex-start">'+
    '<button id="seg_in" class="'+(isIn?'on':'')+'" onclick="switchMovType(\'in\')">↓ Entrada</button>'+
    '<button id="seg_out" class="'+(!isIn?'on':'')+'" onclick="switchMovType(\'out\')">↑ Saída / venda</button></div>'+
    '<input type="hidden" id="m_type" value="'+type+'">'+
    '<div class="form-row"><label>Produto</label><select id="m_prod" onchange="syncMovPrice()">'+opts+'</select></div>'+
    '<div class="form-grid"><div class="form-row"><label>Quantidade</label><input id="m_qty" type="number" min="1" value="1"></div>'+
    '<div class="form-row"><label id="m_pricelbl">'+(isIn?'Custo unitário (R$)':'Preço balcão (R$)')+'</label><input id="m_unit" type="number" step="0.01" min="0"></div></div>'+
    '<div class="form-row"><label>Data</label><input id="m_date" type="date" value="'+todayISO()+'"></div>'+
    '<div class="form-row"><label>Observação (opcional)</label><input id="m_note" placeholder="'+(isIn?'Ex.: Reposição fornecedor X':'Ex.: Venda balcão')+'"></div>'+
    '<div class="err" id="m_err"></div></div>'+
    '<div class="modal-foot"><div class="spacer"></div><button class="btn" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" onclick="saveMov()">Registrar</button></div></div>');
  syncMovPrice();
}
function switchMovType(t){$('#m_type').value=t;$('#seg_in').classList.toggle('on',t==='in');$('#seg_out').classList.toggle('on',t==='out');$('#m_pricelbl').textContent=t==='in'?'Custo unitário (R$)':'Preço balcão (R$)';syncMovPrice();}
function syncMovPrice(){const p=prodById($('#m_prod').value);if(!p)return;$('#m_unit').value=$('#m_type').value==='in'?p.buyCost:p.salePrice;}
async function saveMov(){
  const type=$('#m_type').value,p=prodById($('#m_prod').value);
  const qty=parseInt($('#m_qty').value)||0,unit=parseFloat($('#m_unit').value)||0,date=$('#m_date').value||todayISO(),note=$('#m_note').value.trim();
  if(qty<=0){$('#m_err').textContent='Quantidade deve ser maior que zero.';return;}
  if(type==='out'&&qty>p.stock){$('#m_err').textContent='Estoque insuficiente ('+p.stock+' disponível).';return;}
  const before=stockStatus(p);
  const mv={id:uid(),type,productId:p.id,qty,unit,date,note}; if(type==='out'){mv.cost=p.buyCost;mv.channel='balcao';}
  state.movements.push(mv); p.stock+=type==='in'?qty:-qty;
  await saveData(); closeModal(); toast(type==='in'?'Entrada registrada':'Saída registrada');
  if(type==='out')notifyCrossings([p.id],{[p.id]:before}); render();
}
function showConfirm(title,msg,onYes){showModal('<div class="modal" style="max-width:400px"><div class="modal-head"><h3>'+title+'</h3></div><div class="modal-body"><p style="margin:0;color:var(--muted)">'+msg+'</p></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="confirmYes">Confirmar</button></div></div>');$('#confirmYes').onclick=onYes;}

function emptyState(t,s){const e=el('div','empty');e.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg><div style="font-weight:600;color:var(--ink);margin-bottom:3px">'+t+'</div><div>'+s+'</div>';return e;}
function toast(msg,kind){const t=el('div','toast'+(kind?' '+kind.trim():''));t.innerHTML=(kind?'':'<span class="dot"></span>')+msg;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3000);}

function closeSidebar(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');}
$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('show');};
$('#scrim').onclick=closeSidebar; $('#closeCart').onclick=closeCart;
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));

(async function init(){
  let data=await loadData();
  if(!data||!data.products||!data.products.length){data=seed();state=data;await saveData();} else state=data;
  // compatibilidade com versões anteriores dos dados
  state.customers=state.customers||[]; state.orders=state.orders||[]; state.expenses=state.expenses||[];
  state.settings=state.settings||{storeName:'Rei do Feno'};
  // completa os dados do emitente em bases salvas antes do cadastro fiscal
  (function(){const d=seed().settings;Object.keys(d).forEach(k=>{if(!state.settings[k])state.settings[k]=d[k];});})();
  state.customers.forEach(cu=>{if(!cu.category)cu.category='Consumidor final';});
  // se veio de uma versão anterior sem clientes/custos, popula os exemplos desses módulos
  if(!state.customers.length&&!state.expenses.length){const s2=seed();state.customers=s2.customers;state.orders=s2.orders;state.expenses=s2.expenses;await saveData();}
  state.products.forEach(p=>{if(p.onlinePrice==null)p.onlinePrice=p.salePrice;if(p.blockStock==null)p.blockStock=0;});
  const nm=state.settings.storeName||'Rei do Feno';
  $('#storeNameSide').textContent=nm; $('#storeMark').textContent=nm.charAt(0).toUpperCase();
  if(location.hash==='#loja'){kiosk=true;document.body.classList.add('kiosk');}
  render();
  if(!kiosk){
    const low=state.products.filter(p=>p.stock<=p.minStock);
    if(low.length)setTimeout(()=>toast(low.length+' produto(s) com estoque baixo','warn'),600);
    const over=overdueCustomers();
    if(over.length)setTimeout(()=>toast(over.length+' cliente(s) passaram da periodicidade de compra','warn'),1500);
  }
})();
</script>
</body>
