{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rei do Feno{% endblock %}</title>
  <link rel="preload" href="{% static 'fonts/archivo-var.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="autenticacao">
<a class="pulo" href="#conteudo">Pular para o conteúdo principal</a>
{% include "includes/icones.html" %}
<main id="conteudo">
  <div class="autenticacao__marca">
    <svg viewBox="0 0 20 20" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><use href="#i-marca"/></svg>
    Rei do Feno
  </div>
  {% include "includes/messages.html" %}
  {% block auth_content %}{% endblock %}
</main>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
