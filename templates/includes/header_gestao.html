<header class="barra-superior">
  <div class="barra-superior__inner">
    <button class="btn-gaveta" type="button" data-abrir-gaveta aria-controls="lateral" aria-expanded="false">
      <svg viewBox="0 0 20 20" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
      <span class="visually-hidden">Abrir menu de navegação</span>
    </button>
    <span class="barra-superior__titulo">{% block titulo_barra %}{% endblock %}</span>
    <span class="barra-superior__acao"></span>
  </div>
</header>
