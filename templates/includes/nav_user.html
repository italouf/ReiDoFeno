{% comment %}
Área do usuário no rodapé da sidebar.
<!-- Futuramente: exibir perfil (Administrador/Gestor/Vendedor) vindo de user.perfil -->
{% endcomment %}
{% if user.is_authenticated %}
  <p style="margin:0 0 var(--espaco-3); font-weight:600; color:var(--branco);">{{ user.get_full_name|default:user.username }}</p>
  <form method="post" action="{% url 'accounts:logout' %}" data-enviar>
    {% csrf_token %}
    <button type="submit" class="btn btn--secundario btn--pequeno" style="width:100%; border-color:rgb(255 255 255 / .25); color:var(--areia-100);">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-sair"/></svg>
      Sair
    </button>
  </form>
{% else %}
  <a class="btn btn--secundario btn--pequeno" style="width:100%; border-color:rgb(255 255 255 / .25); color:var(--areia-100);" href="{% url 'accounts:login' %}">
    Entrar
  </a>
{% endif %}
