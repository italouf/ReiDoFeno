{% extends "base.html" %}
{% block title %}{{ titulo }} — Rei do Feno{% endblock %}
{% block content %}
<div class="cartao form-cartao" style="max-width:32rem;">
  <h1>{{ titulo }}</h1>
  <form method="post" data-enviar>
    {% csrf_token %}
    {% include "components/form_campos.html" with form=form %}
    <div class="form-acoes">
      <button type="submit" class="btn">Registrar</button>
      <a class="btn btn--secundario" href="{% url 'stock:estoque_lista' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
