{% extends "base.html" %}
{% block title %}Nova interação — {{ cliente.nome }}{% endblock %}
{% block content %}
<div class="cartao form-cartao">
  <h1>Nova interação</h1>
  <p style="color:var(--tinta-700);">Cliente: <strong>{{ cliente.nome }}</strong></p>
  <form method="post" data-enviar>
    {% csrf_token %}
    {% include "components/form_campos.html" with form=form %}
    <div class="form-acoes">
      <button type="submit" class="btn">Registrar</button>
      <a class="btn btn--secundario" href="{% url 'customers:cliente_detalhe' cliente.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
