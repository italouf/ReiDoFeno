{% extends "base.html" %}
{% block title %}NF-e manual — {{ pedido.numero }}{% endblock %}
{% block content %}
<div class="cartao form-cartao">
  <h1>Registrar NF-e manual</h1>
  <p style="color:var(--tinta-700);">Pedido <strong>{{ pedido.numero }}</strong> · {{ pedido.cliente.nome }}</p>
  <form method="post" data-enviar>
    {% csrf_token %}
    {% include "components/form_campos.html" with form=form %}
    <div class="form-acoes">
      <button type="submit" class="btn">Vincular nota ao pedido</button>
      <a class="btn btn--secundario" href="{% url 'sales:pedido_interno_detail' pedido.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
